name: CI

on:
  pull_request:
    paths: ['android/**']
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/libs.versions.toml') }}

      - name: Compile check
        run: ./gradlew compileReleaseKotlin --no-daemon

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest --no-daemon

      - name: Run Detekt
        run: ./gradlew detekt --no-daemon

      - name: Validate changelog JSON
        run: ./gradlew validateChangelogJson --no-daemon

      - name: Generate coverage report
        run: ./gradlew koverHtmlReport --no-daemon || true  # 部分测试失败（预存图片资源问题）仍可生成二进制覆盖数据

      - name: Upload coverage report (if generated)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: coverage-report
          path: android/**/build/reports/kover/
