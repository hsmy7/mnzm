style:
  MaxLineLength:
    maxLineLength: 120       # Compose UI 链式调用需要
  WildcardImport:
    active: true
  UnusedImports:
    active: true              # 未使用 import 必须清理
  MagicNumber:
    active: false            # 游戏数学常量
naming:
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'         # Compose 函数使用 PascalCase
complexity:
  TooManyFunctions:
    active: true
    thresholdInFiles: 15     # 从 30 收紧
    thresholdInObjects: 12   # Dagger @Module 的 @Provides 函数属于 DI 样板代码
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
  LongMethod:
    active: true
    threshold: 60            # 单函数体最大 60 行（CLAUDE.md 3.3）
    # 现有违规冻结在 detekt-baseline.xml（全库 299 条），
    # 作为超长函数拆分任务队列，拆分一个摘除一条（baseline 只缩不增）
empty-blocks:
  EmptyCatchBlock:
    active: true             # 禁止空 catch 块

# ════════════════════════════════════════════
# 自定义规则：game-engine（防 ANR #9041/#5068）
# ════════════════════════════════════════════
game-engine:
  LaunchOnEngineRequired:
    active: true
    description: "Delegate 中的引擎调用必须通过 GameEngine.launchOnEngine 派发到引擎线程"
  BlockingCallInCoroutine:
    active: true
    description: "协程上下文中的阻塞调用检测"
  RunBlockingInSuspend:
    active: true
    description: "挂起函数中的 runBlocking 检测"

# ════════════════════════════════════════════
# 自定义规则：code-quality（代码规模守卫）
# ════════════════════════════════════════════
code-quality:
  FileLength:
    active: true
    threshold: 2000          # 单文件最大 2000 行（CLAUDE.md 3.1）
    # 主工作树当前零违规；.worktrees/ui-layout-unification 分支
    # 4 个超限文件（CultivationService 4227 行等）合回时被此规则拦截

# ════════════════════════════════════════════
# Q-8：测试代码 `!!` 评审规则（2026-08-02）
# 测试 sourceSet 存在 ~160 处 `!!`（Robolectric 测试惯例），
# 不批量改（历史测试行为稳定）。评审要求：
# - 新增测试代码禁止使用 `!!`（与主源码同标准）
# - 已有测试 `!!` 随触碰文件顺带清理
# ════════════════════════════════════════════
