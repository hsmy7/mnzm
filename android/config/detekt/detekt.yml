style:
  MaxLineLength:
    maxLineLength: 120       # Compose UI 链式调用需要
  WildcardImport:
    active: true
  MagicNumber:
    active: false            # 游戏数学常量
naming:
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'         # Compose 函数使用 PascalCase
complexity:
  TooManyFunctions:
    active: true
    thresholdInFiles: 15     # 从 30 收紧
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
empty-blocks:
  EmptyCatchBlock:
    active: true             # 禁止空 catch 块
