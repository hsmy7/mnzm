style:
  MaxLineLength:
    maxLineLength: 120       # Compose UI 链式调用需要
  WildcardImport:
    active: true
  MagicNumber:
    active: false            # 游戏数学常量
naming:
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'         # Compose 函数使用 PascalCase
complexity:
  TooManyFunctions:
    active: true
    thresholdInFiles: 15     # 从 30 收紧
    thresholdInObjects: 12   # Dagger @Module 的 @Provides 函数属于 DI 样板代码
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
empty-blocks:
  EmptyCatchBlock:
    active: true             # 禁止空 catch 块

# ════════════════════════════════════════════
# 自定义规则：game-engine（防 ANR #9041/#5068）
# ════════════════════════════════════════════
game-engine:
  LaunchOnEngineRequired:
    active: true
    description: "Delegate 中的引擎调用必须通过 GameEngine.launchOnEngine 派发到引擎线程"
  BlockingCallInCoroutine:
    active: true
    description: "协程上下文中的阻塞调用检测"
  RunBlockingInSuspend:
    active: true
    description: "挂起函数中的 runBlocking 检测"
