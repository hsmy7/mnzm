plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    // 2026-08-01：kover 覆盖率盲区修复——全模块纳入统计
    alias(libs.plugins.kover)
    // 2026-08-03：detekt 覆盖盲区修复——core/ui 纳入静态检查
    alias(libs.plugins.detekt)
}

detekt {
    buildUponDefaultConfig = true
    allRules = false
    config.setFrom(files("$rootDir/config/detekt/detekt.yml"))
    baseline = file("$projectDir/detekt-baseline.xml")
    parallel = true
}

android {
    namespace = 'com.xianxia.sect.core.ui'

    defaultConfig {
        consumerProguardFiles "consumer-rules.pro"
    }

    buildFeatures {
        compose = true
    }

    testOptions {
        unitTests {
            // Robolectric 渲染组件（painterResource 读取 R.drawable 资源）必需
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    composeCompiler {
        enableStrongSkippingMode = true
        stabilityConfigurationFile = rootProject.file("stability_config.conf")
    }
}

// 2026-08-01：显式单 fork——共享静态状态跨测试类并行污染
tasks.withType(Test).configureEach {
    maxParallelForks = 1
}

dependencies {
    api project(':core:domain')
    detektPlugins(project(':detekt-rules'))

    // AndroidX Core (WindowCompat, etc.)
    implementation libs.core.ktx
    implementation libs.appcompat

    // Activity Compose (BackHandler, etc.)
    implementation libs.activity.compose

    // Jetpack Compose
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.material3
    implementation libs.compose.material.icons.core
    debugImplementation libs.compose.ui.tooling

    // Test
    testImplementation libs.junit
    testImplementation libs.coroutines.test
    testImplementation libs.robolectric
    testImplementation(platform(libs.compose.bom))
    testImplementation libs.compose.ui.test
    testImplementation libs.compose.ui.test.junit4
}
