plugins {
    id 'xianxia.android'
    alias(libs.plugins.kotlin.serialization)
    // kover：全模块纳入覆盖率统计
    alias(libs.plugins.kover)
    alias(libs.plugins.detekt)
}

// Kover 按需开关——本地默认关闭（消除插桩开销，见 docs/build-perf/kover-overhead.md），CI 传 -Pkover.enabled=true
kover {
    if (!providers.gradleProperty('kover.enabled').getOrElse('false').toBoolean()) {
        disable()
    }
}

// 配置期文件读取经 providers.fileContents 声明式跟踪，改 version.properties
// 后配置缓存正确失效（普通 File IO 无法感知）。
// 文件不存在时 asText 返回空文本 → 空 Properties。
def loadProperties(String text) {
    def p = new Properties()
    p.load(new StringReader(text))
    p
}

def versionProps = providers.fileContents(rootProject.layout.projectDirectory.file("../version.properties"))
    .asText.map { loadProperties(it) }.get()

detekt {
    buildUponDefaultConfig = true
    allRules = false
    config.setFrom(files("$rootDir/config/detekt/detekt.yml"))
    baseline = file("$projectDir/detekt-baseline.xml")
    parallel = true
}

android {
    namespace = 'com.xianxia.sect.core.domain'

    defaultConfig {
        consumerProguardFiles "consumer-rules.pro"

        buildConfigField "String", "VERSION_NAME",
            '"' + versionProps.getProperty('versionName', '0.0.00') + '"'
    }

    buildFeatures {
        compose = false
        buildConfig = true
    }
}

// 显式单 fork——共享静态状态跨测试类并行污染
tasks.withType(Test).configureEach {
    maxParallelForks = 1
}

dependencies {
    // 自定义 Detekt 规则（game-engine 规则集，防 ANR #9041/#5068）
    detektPlugins(project(':detekt-rules'))
    // Kotlinx
    implementation libs.serialization.json
    implementation libs.serialization.protobuf
    implementation libs.coroutines.core

    // AndroidX Annotations (@Keep 等)
    implementation libs.annotation

    // JSR-330 Dependency Injection (@Inject, @Singleton)
    implementation "javax.inject:javax.inject:1"

    // Compose Annotations (@Immutable 等) — 仅注解，compileOnly
    compileOnly platform(libs.compose.bom)
    compileOnly libs.compose.runtime
    compileOnly libs.compose.ui.graphics

    // 架构决策：domain 层保留 Room 注解作为持久化元数据
    // 理由：domain 层 22 个实体类同时承担领域模型与持久化实体双重职责，
    //       data 层 @Database 直接引用这些类型作为表实体。
    //       引入 DTO 层需新建 32 个 DTO 类 + 32 套双向映射 + 修改 400+ Dao 方法签名，
    //       样板代码量大且 Disciple 的 6 个 @Embedded 映射极易出错。
    //       经评估，保留现状的收益高于 DTO 层引入成本。
    // 约束：Room 注解使用范围不得扩大（由 DomainDependencyTest 守护），
    //       仅限 @Entity/@ColumnInfo/@PrimaryKey/@Embedded/@Ignore/@Index/@ForeignKey，
    //       不得引入 Room 运行时依赖（room-runtime/room-ktx）。
    implementation libs.room.common

    testImplementation libs.junit
    testImplementation libs.coroutines.test
    testImplementation libs.konsist.test
    testImplementation libs.robolectric
}

// 模块特有编译器参数（SDK/Java/Kotlin 公共配置由 xianxia.android convention 提供）
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        freeCompilerArgs += ['-opt-in=kotlinx.serialization.ExperimentalSerializationApi']
    }
}