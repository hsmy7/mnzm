plugins {
    id 'xianxia.android'
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.ksp)
    alias(libs.plugins.hilt)
    alias(libs.plugins.kover)
    alias(libs.plugins.detekt)
}

// Kover 按需开关——本地默认关闭（消除插桩开销，见 docs/build-perf/kover-overhead.md），CI 传 -Pkover.enabled=true
kover {
    if (!providers.gradleProperty('kover.enabled').getOrElse('false').toBoolean()) {
        disable()
    }
}

detekt {
    buildUponDefaultConfig = true
    allRules = false
    config.setFrom(files("$rootDir/config/detekt/detekt.yml"))
    baseline = file("$projectDir/detekt-baseline.xml")
    parallel = true
}

android {
    namespace = 'com.xianxia.sect.core.data'

    buildFeatures {
        buildConfig = true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    // 显式单 fork——共享静态状态跨测试类并行污染
    tasks.withType(Test).configureEach {
        maxParallelForks = 1
        // StorageSystemBenchmark 门控——默认跳过，-Pbenchmark.enabled=true 启用
        systemProperty 'benchmark.enabled', project.findProperty('benchmark.enabled') ?: 'false'
    }

    defaultConfig {
        consumerProguardFiles "consumer-rules.pro"
    }
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {
    // 自定义 Detekt 规则（game-engine 规则集，防 ANR #9041/#5068）
    detektPlugins(project(':detekt-rules'))
    api project(':core:domain')

    // Kotlinx
    implementation libs.serialization.json
    implementation libs.serialization.protobuf
    implementation libs.coroutines.android

    // Room
    implementation libs.room.runtime
    implementation libs.room.ktx
    ksp libs.room.compiler

    // Hilt
    implementation libs.hilt.android
    ksp libs.hilt.compiler

    // Network (for serialization helpers)
    testImplementation libs.gson

    // Security
    implementation libs.security.crypto

    // Storage
    implementation libs.mmkv
    implementation libs.lz4
    implementation libs.zstd
    implementation libs.relinker

    // Protobuf
    implementation libs.protobuf.javalite

    // JSR-330
    implementation "javax.inject:javax.inject:1"

    // Compose Annotations (@Immutable 等) — 仅注解
    compileOnly platform(libs.compose.bom)
    compileOnly libs.compose.ui

    testImplementation libs.junit
    testImplementation libs.coroutines.test
    testImplementation libs.robolectric
    testImplementation libs.test.core
    testImplementation libs.test.ext.junit
    testImplementation libs.test.runner
    testImplementation libs.room.testing
    testImplementation libs.kotlin.reflect
}

// 模块特有编译器参数（SDK/Java/Kotlin 公共配置由 xianxia.android convention 提供）
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        freeCompilerArgs += ['-opt-in=kotlinx.serialization.ExperimentalSerializationApi']
    }
}