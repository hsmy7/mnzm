// Bugly mapping 存档 + 上传
def buglyAppId = findProperty('BUGLY_APP_ID') ?: ''
def buglyAppKey = findProperty('BUGLY_APP_KEY') ?: ''
def mappingVersionName = android.defaultConfig.versionName
def mappingPkgName = android.defaultConfig.applicationId
def mappingBuildDir = layout.buildDirectory
def mappingRootDir = layout.projectDirectory.dir("..")

tasks.register('archiveAndUploadMapping') {
    group = 'bugly'
    description = 'Archive mapping.txt and upload to Bugly for symbolication'
    doLast {
        def mappingFile = mappingBuildDir.file("outputs/mapping/release/mapping.txt").get().asFile
        if (!mappingFile.exists()) {
            logger.warn("mapping.txt not found, run assembleRelease first")
            return
        }
        def destDir = mappingRootDir.dir("mappings/${mappingVersionName}").asFile
        destDir.mkdirs()
        mappingFile.renameTo(new File(destDir, "mapping-${mappingVersionName}.txt"))
        logger.lifecycle("Mapping archived to ${destDir}")

        logger.lifecycle("Uploading mapping to Bugly...")
        def cmd = [
            'curl', '-k', '-s',
            "https://api.bugly.qq.com/openapi/file/upload/symbol?app_key=${buglyAppKey}&app_id=${buglyAppId}",
            '--form', 'api_version=1',
            '--form', "app_id=${buglyAppId}",
            '--form', "app_key=${buglyAppKey}",
            '--form', 'symbolType=1',
            '--form', "bundleId=${mappingPkgName}",
            '--form', "productVersion=${mappingVersionName}",
            '--form', 'fileName=mapping.txt',
            '--form', "file=@${destDir}/mapping-${mappingVersionName}.txt"
        ]
        logger.lifecycle("Bugly response: ${cmd.execute().text.trim()}")
    }
}

// 🔴 编译时防护：检查 delegate 文件中是否还有 scope.launch 直接调用
tasks.register('checkDelegateLaunchPattern') {
    group = 'verification'
    description = '检查 delegate 文件未通过 launchOnEngine 的 scope.launch 调用'
    doLast {
        def delegateDir = file("$rootDir/feature/game/src/main/java/com/xianxia/sect/ui/game/delegate")
        if (!delegateDir.exists()) {
            logger.warn("delegate 目录不存在，跳过检查: $delegateDir")
            return
        }
        // 排除白名单文件：GameLoopDelegate 使用 scope.launch 做 UI 动画（不调 engine）
        def excludedFiles = ['GameLoopDelegate.kt']
        def violations = []
        delegateDir.eachFileRecurse { file ->
            if (file.name.endsWith('.kt') && !excludedFiles.contains(file.name)) {
                file.eachLine { line, lineNo ->
                    if ((line =~ /\bscope\.launch\s*\{/ ||
                         line =~ /\bviewModelScope\.launch\s*\{/) &&
                        !line.contains("Dispatchers.") &&
                        !line.contains("//")) {
                        violations.add("${file.name}:${lineNo}: ${line.trim()}")
                    }
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                "发现 ${violations.size} 处 delegate 中 scope.launch 直接调用（应使用 gameEngine.launchOnEngine）：\n" +
                violations.join("\n")
            )
        }
        logger.lifecycle("checkDelegateLaunchPattern 通过")
    }
}
tasks.named('detekt').configure { finalizedBy('checkDelegateLaunchPattern') }

// 🔴 编译时防护：changelog_entries.json 格式守卫，防止非法 JSON/缺字段再次入库
tasks.register('validateChangelogJson') {
    group = 'verification'
    description = '校验 changelog_entries.json 顶层数组与 date/changes/version 字段'
    doLast {
        def jsonFile = file("$projectDir/src/main/assets/changelog_entries.json")
        if (!jsonFile.exists()) {
            throw new GradleException("changelog_entries.json 不存在: ${jsonFile}")
        }
        def json = new groovy.json.JsonSlurper().parse(jsonFile)
        if (!(json instanceof List)) {
            throw new GradleException("changelog_entries.json 顶层必须是数组")
        }
        json.eachWithIndex { entry, i ->
            if (!(entry instanceof Map)) throw new GradleException("条目[$i] 必须是对象")
            if (!(entry.date instanceof String) || entry.date.isBlank()) {
                throw new GradleException("条目[$i] 缺少非空字符串 date")
            }
            if (!(entry.changes instanceof List) || entry.changes.isEmpty()) {
                throw new GradleException("条目[$i] 缺少非空字符串数组 changes")
            }
            entry.changes.each { c ->
                if (!(c instanceof String) || c.isBlank()) {
                    throw new GradleException("条目[$i] changes 含非字符串/空白项")
                }
            }
            if (entry.containsKey("version") && !(entry.version instanceof String)) {
                throw new GradleException("条目[$i] version 若存在必须为字符串")
            }
        }
        logger.lifecycle("validateChangelogJson 通过：共 ${json.size} 条")
    }
}
tasks.named('check').configure { dependsOn('validateChangelogJson') }

// ============================================================
// 2026-08-01：建筑占地尺寸 C++ 头文件生成任务
// SpriteAtlasDef.kt（Kotlin）为唯一真相源 → footprint_table.h（C++）
// 消灭 NativeBridge.cpp / SpriteAtlasDef 双份手写魔法表的漂移风险
// ============================================================
tasks.register('generateFootprintHeader') {
    group = 'build'
    description = '从 SpriteAtlasDef.kt 生成 NativeBridge.cpp 引用的 footprint_table.h'
    doLast {
        def src = file("${rootProject.projectDir}/core/engine/src/main/java/com/xianxia/sect/core/render/SpriteAtlasDef.kt").text
        // 提取 FOOTPRINT_BY_NAME_INDEX 数组的 (w to h) pair（格式固定：N to N,）
        def pairs = []
        def matcher = src =~ /(\d+)\s+to\s+(\d+)/
        while (matcher.find()) {
            pairs.add([matcher.group(1).toInteger(), matcher.group(2).toInteger()])
        }
        if (pairs.isEmpty()) {
            throw new GradleException("generateFootprintHeader: 未从 SpriteAtlasDef.kt 提取到占地尺寸 pair")
        }
        def w = pairs.collect { it[0] }.join(',')
        def h = pairs.collect { it[1] }.join(',')
        def header = """// GENERATED FILE — 由 SpriteAtlasDef.kt 生成，禁止手改。
// 修改建筑占地尺寸请改 SpriteAtlasDef.kt 的 FOOTPRINT_BY_NAME_INDEX，
// 然后运行: ./gradlew generateFootprintHeader
static const int FP_W[] = {${w}};
static const int FP_H[] = {${h}};
static const int FP_COUNT = ${pairs.size};
"""
        def out = file('src/main/cpp/footprint_table.h')
        out.parentFile.mkdirs()
        out.write(header)
        logger.lifecycle("generateFootprintHeader: ${out} (${pairs.size} entries)")
    }
}
// preBuild 前生成——确保 native 编译时头文件最新
tasks.named('preBuild').configure { dependsOn('generateFootprintHeader') }
