// 配置期文件读取经 providers.fileContents 声明式跟踪，改 api.properties/
// keystore.properties/version.properties 后配置缓存正确失效（普通 File IO
// 配置缓存无法感知，改了不生效）。文件不存在时 asText 返回空文本 → 空 Properties。
def loadProperties(String text) {
    def p = new Properties()
    p.load(new StringReader(text))
    p
}

def keystoreProperties = providers.fileContents(rootProject.layout.projectDirectory.file("keystore.properties"))
    .asText.map { loadProperties(it) }.get()
def apiProperties = providers.fileContents(rootProject.layout.projectDirectory.file("api.properties"))
    .asText.map { loadProperties(it) }.get()
def versionProps = providers.fileContents(rootProject.layout.projectDirectory.file("../version.properties"))
    .asText.map { loadProperties(it) }.get()

android {
    namespace = 'com.xianxia.sect'

    ndkVersion = "27.0.12077973"  // NDK r27 (2025 stable, Vulkan 1.1+ 支持)

    defaultConfig {
        applicationId = "com.xianxia.sect"
        versionCode = versionProps.getProperty('versionCode', '1').toInteger()
        versionName = versionProps.getProperty('versionName', '0.0.00')

        buildConfigField "String", "API_BASE_URL", '"' + apiProperties.getProperty('API_BASE_URL', 'https://api.xianxia.com/api/') + '"'
        buildConfigField "String", "TAPTAP_CLIENT_ID", '"' + apiProperties.getProperty('TAPTAP_CLIENT_ID', '') + '"'
        buildConfigField "String", "TAPTAP_CLIENT_TOKEN", '"' + apiProperties.getProperty('TAPTAP_CLIENT_TOKEN', '') + '"'
        buildConfigField "boolean", "TAPTAP_IS_CN", apiProperties.getProperty('TAPTAP_IS_CN', 'true')
        buildConfigField "String", "TAPDB_CHANNEL", '"' + apiProperties.getProperty('TAPDB_CHANNEL', 'taptap') + '"'
        buildConfigField "String", "APK_SIGNATURE_HASH", '"' + apiProperties.getProperty('APK_SIGNATURE_HASH', '') + '"'
        buildConfigField "String", "BUGLY_APP_ID", '"' + apiProperties.getProperty('BUGLY_APP_ID', '') + '"'
        buildConfigField "String", "BUGLY_APP_KEY", '"' + apiProperties.getProperty('BUGLY_APP_KEY', '') + '"'
        buildConfigField "String", "UMENG_APP_KEY", '"' + apiProperties.getProperty('UMENG_APP_KEY', '') + '"'
        buildConfigField "String", "UMENG_CHANNEL", '"' + apiProperties.getProperty('UMENG_CHANNEL', 'taptap') + '"'

        // 友盟集成测试唤起码（AndroidManifest um.${umengAppKey} scheme）——AppKey 就位后
        // 由 Umeng 后台/集成测试工具自动唤起，未配置时占位不影响其他 scheme 行为
        manifestPlaceholders = [umengAppKey: apiProperties.getProperty('UMENG_APP_KEY', '')]

        // 仅保留 64 位 ARM 架构（arm64-v8a，决策7：移除 armeabi-v7a，APK native 包体约 -40%）
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    androidResources {
        noCompress 'webp'
    }

    def keystoreFile = file(keystoreProperties.getProperty('storeFile', '../../../keystore/keystore.jks'))
    def canSignRelease = keystoreFile.exists() &&
        keystoreProperties.getProperty('storePassword') != null &&
        !keystoreProperties.getProperty('storePassword').isEmpty()

    if (!canSignRelease) {
        logger.lifecycle("Warning: Keystore not available at ${keystoreFile.absolutePath}. Building without release signing.")
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile = keystoreFile
                storePassword = keystoreProperties.getProperty('storePassword', '')
                keyAlias = keystoreProperties.getProperty('keyAlias', 'xianxia_sect')
                keyPassword = keystoreProperties.getProperty('keyPassword', '')
                v1SigningEnabled = true
                v2SigningEnabled = true
            }
        }
    }

    // ============================================================
    // Native 渲染引擎（Vulkan C++ 实现）
    // 使用 NDK CMake 构建，要求 NDK r25+（2024+ 版本）
    // ============================================================
    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = "3.22.1+"
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (canSignRelease) {
                signingConfig = signingConfigs.release
            }
            buildConfigField "boolean", "DEBUG_MODE", "false"
            // release native 符号打包为 SYMBOL_TABLE（Bugly 原生崩溃符号最小可行，
            // 比默认仅 .so 全字节可读，且不显著增大包体）
            ndk {
                debugSymbolLevel "SYMBOL_TABLE"
            }
        }
        debug {
            // debug 复用 release 签名：TapTap 后台不支持一个包名配置两个签名，
            // 保证 Android Studio 直接运行的包能通过 TapTap 签名校验
            // （签名 = 正式包 8f670470a0bb240c590d2d55e162ffc0）。
            // 注意：同签名意味着 debug 包可覆盖安装正式包（数据/凭证串包风险），
            // 测试机请勿存放重要正式档。
            debuggable true
            if (canSignRelease) {
                signingConfig = signingConfigs.release
            }
            buildConfigField "boolean", "DEBUG_MODE", "true"
        }
    }

    lint {
        checkReleaseBuilds = true
        abortOnError = true
        baseline = file("lint-baseline.xml")
        disable += "InvalidPackage"
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    // 显式单 fork——共享静态状态（GameLoopDelegate.healthCheckEnabled 等）
    // 跨测试类并行时相互污染
    tasks.withType(Test).configureEach {
        maxParallelForks = 1
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    composeCompiler {
        enableStrongSkippingMode = true
        stabilityConfigurationFile = rootProject.file("stability_config.conf")
        // 指标收集按需开启（-Pcompose.metrics），默认关闭省编译开销
        if (project.hasProperty('compose.metrics')) {
            reportsDestination = layout.buildDirectory.dir("compose_metrics")
            metricsDestination = layout.buildDirectory.dir("compose_metrics")
        }
    }

    // 决策7：移除纹理分包开关（仅一种 KTX 格式，split 从未生效）
    packaging {
        jniLibs {
            useLegacyPackaging = true
            excludes += ["**/x86/**", "**/x86_64/**"]
        }
    }
}

