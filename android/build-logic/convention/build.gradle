plugins {
    id 'groovy-gradle-plugin'
}

// convention plugin 脚本 import 的 Kotlin/AGP 类需编译期 classpath：
// Gradle 8.x 无 getPluginClasspath() API（9.0+ 才有），按 Maven 坐标声明，
// 版本单源来自 gradle/libs.versions.toml（升级 catalog 自动生效）
dependencies {
    // 版本与 gradle/libs.versions.toml 同步（升级 AGP/Kotlin 时两处一起改）；
    // Groovy 脚本中 catalog Provider 解包受限，坐标显式声明最稳
    implementation 'com.android.tools.build:gradle:8.10.0'
    implementation 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'
}
