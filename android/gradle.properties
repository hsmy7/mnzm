# 内存预算保守化（2026-08-14）：原 8G Gradle 堆 + Kotlin daemon 继承同 8G → 双 8G 打穿
# 物理内存（hs_err_pid80840.log: mmap failed to map 1.6GB）。32GB 开发机档位：
# Gradle 6G（任务编排/配置）+ Kotlin daemon 4G（编译主体，大模块 engine 117K 行）。
# 8GB 机器降为 3G+2G；CI 用 GRADLE_OPTS 覆盖（见 ci.yml）。
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1536m -XX:+UseG1GC -Dfile.encoding=UTF-8
# 显式设置 Kotlin daemon 堆——不设时继承 Gradle daemon 的 jvmargs（曾致双 8G）
kotlin.daemon.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
# 注：BUGLY_APP_ID/BUGLY_APP_KEY 从 api.properties 读取（build.gradle），
# 本机 JDK/GRADLE_USER_HOME 路径写 local.properties（均已 gitignore）——2026-08-01 平台解耦
org.gradle.parallel=true
org.gradle.caching=true
# 配置缓存（2026-08-14，阶段 3.4）——problems=warn 渐进消化；全绿后视情况收紧为 fail
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableJetifier=true
kotlin.incremental=true
ksp.incremental=true
android.enableR8.fullMode=true
# Hilt 2.48+: Disable ASM aggregation task to prevent R8 duplicate class errors
# (StackableItem from :core:domain duplicates in app transformReleaseClassesWithAsm)
dagger.hilt.android.internal.disableAggregatingTask=true
# AGP 8.12+: R8 unified code+resource optimization (up to 50% APK reduction)
# android.r8.optimizedResourceShrinking=true
